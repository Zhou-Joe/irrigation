{% extends 'operations/base.html' %}{% block content %}<div class="op-title-row"><h2>引入现有灌溉区域</h2><a href="{% url 'operations:locations' %}">返回地点</a></div><p class="op-muted">仅建立共享地点引用，不会修改原区域。引入后，可在地点详情里选择接收团队。</p><form class="op-search"><label for="q">搜索区域</label><input name="q" id="q" value="{{ query }}" placeholder="区域名称或编号"><button class="op-btn op-secondary">搜索</button></form><div class="op-list">{% for zone in zones %}<div class="op-card op-location"><span>{{ zone.code }} · {{ zone.name }}</span><form method="post">{% csrf_token %}<input type="hidden" name="zone" value="{{ zone.pk }}"><button class="op-btn">引入地点</button></form></div>{% empty %}<p>未找到可引入的区域。</p>{% endfor %}</div>{% endblock %}
