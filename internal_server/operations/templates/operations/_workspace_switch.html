{% if business_choices %}
{% if request.path != '/' %}
<a href="/" class="{% if in_operations %}op-btn op-secondary{% else %}top-nav-logout{% endif %}">切换业务</a>
{% else %}
<form action="{% url 'operations:switch' %}" method="post" class="business-switch" data-team-switch style="display:flex;gap:4px;align-items:center;margin:0">
  {% csrf_token %}<select name="business" aria-label="业务视图" style="max-width:110px;min-width:0;border:1px solid #d0ddd4;border-radius:6px;padding:5px;background:#fff;color:#1b4332;font:inherit">
    {% for item in business_choices %}<option value="{{ item.code }}" {% if item.code == business_selected %}selected{% endif %}>{{ item.label }}</option>{% endfor %}
  </select><button type="submit" class="{% if in_operations %}op-btn op-secondary{% else %}top-nav-logout{% endif %}"{% if not in_operations %} style="border:0;background:transparent;cursor:pointer"{% endif %}>切换</button>
</form>
{% endif %}{% endif %}
