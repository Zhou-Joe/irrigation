<form id="pestWorkorderForm">{% csrf_token %}<input type="hidden" name="team" value="{{ team.pk }}"><input type="hidden" name="catalog" value="{{ catalog.pk }}"><input type="hidden" name="submission_key" value="{{ submission_key }}">
<div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:.85em;color:#888"><span>{{ today }}</span><span>{{ request.user.get_full_name|default:request.user.username }}</span></div>
<div class="v2-fg"><div class="v2-form-row"><div><label class="v2-fl" for="pestDate">日期</label><select name="date" id="pestDate" class="v2-select">{% for date in dates %}<option value="{{ date }}">{{ date }}</option>{% endfor %}</select></div><div><div class="v2-fl">班次</div><input type="hidden" name="shift" value="{{ shifts.0 }}"><div class="v2-chip-group">{% for shift in shifts %}<button type="button" class="v2-chip{% if forloop.first %} active{% endif %}" data-shift="{{ shift }}" aria-pressed="{% if forloop.first %}true{% else %}false{% endif %}">{{ shift }}</button>{% endfor %}</div></div></div></div>
<div class="v2-fg"><div class="v2-form-row"><div><label class="v2-fl" for="pestTeamSize">作业组人数</label><input class="v2-input" id="pestTeamSize" name="team_size" type="number" min="0" max="99" value="1" required></div><div><label class="v2-fl" for="pestThirdParty">第三方人数</label><input class="v2-input" id="pestThirdParty" name="third_party_count" type="number" min="0" max="99" value="0" required></div></div></div>
<div class="v2-fg"><div class="v2-form-row"><div><label class="v2-fl" for="pestStart">开始时间</label><select name="work_start_time" id="pestStart" class="v2-select">{% for time in time_options %}<option value="{{ time }}"{% if time == start_time %} selected{% endif %}>{{ time }}</option>{% endfor %}</select></div><div><label class="v2-fl" for="pestEnd">完成时间</label><select name="work_end_time" id="pestEnd" class="v2-select">{% for time in time_options %}<option value="{{ time }}"{% if time == end_time %} selected{% endif %}>{{ time }}</option>{% endfor %}</select></div></div></div>
<div class="v2-fg"><div class="v2-fl">作业地点</div><button type="button" id="pestPlaceTrigger" class="v2-select" style="text-align:left;cursor:pointer" aria-haspopup="dialog"><span id="pestPlaceSummary">选择作业地点</span><span aria-hidden="true" style="float:right">›</span></button><div id="pestPlaceValues"></div></div>
<div class="v2-fg"><div class="v2-fl">工作类别</div><div id="pestCategoryChips" class="v2-chip-group"></div></div><div class="v2-fg"><div class="v2-fl">工作内容</div><div id="pestWorkLevels"></div><div id="pestSelectedWork" aria-live="polite"></div></div>
<div class="v2-fg"><label class="v2-fl" for="pestRemark">备注</label><textarea class="v2-textarea" id="pestRemark" name="remark" rows="2" placeholder="可选备注…"></textarea></div>{{ work_tree|json_script:'pest-work-tree' }}{{ location_options|json_script:'pest-location-options' }}</form>
