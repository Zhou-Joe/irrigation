{% if can_pest_manage or can_manage %}
<section id="mapLocationCreate" class="pest-location-editor" data-team="{% if membership %}{{ membership.team_id }}{% else %}{{ workspace_membership.team_id }}{% endif %}" aria-labelledby="mapCreateTitle" hidden>
  <form action="{% url 'operations:location_batch' %}" method="post">
    {% csrf_token %}
    <header><strong id="mapCreateTitle">新增地点 / 设施</strong><button type="button" data-create-close aria-label="结束新增"><svg class="ui-icon"><use href="#pwa-close"/></svg></button></header>
    <p data-create-position>在地图上点选位置</p>
    <div class="pest-create-fields"><label>名称<input class="v2-input" name="name" required maxlength="150" placeholder="如：游客中心、诱捕笼 01、蜂箱 A"></label><label>类型<select class="v2-select" name="kind">{% for value,label in location_kind_choices %}<option value="{{ value }}" {% if value == 'building' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label></div>
    <details open><summary>地点编号（可选）</summary><input class="v2-input" name="code" maxlength="100" placeholder="可留空"></details>
    <footer><span data-create-status role="status"></span><button class="v2-btn-submit" type="submit">保存并继续</button></footer>
  </form>
</section>
{% endif %}
