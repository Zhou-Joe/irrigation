{% extends 'operations/base.html' %}{% block title %}我的账号{% endblock %}{% block ops_content %}
<header class="app-head"><div><h1>我的账号</h1><p class="app-subtitle">{{ membership.team.name }} · {{ account_role_label }}</p></div></header>
<div class="ops-grid"><section class="op-card"><h2>个人资料</h2><form action="{% url 'operations:profile' %}" method="post" data-ops-post>{% csrf_token %}<input name="action" type="hidden" value="details"><div class="op-field"><label>登录账号</label><input value="{{ user.username }}" readonly></div><div class="op-field"><label for="selfName">姓名</label><input id="selfName" name="full_name" value="{{ user.get_full_name }}" maxlength="150" required></div><div class="op-field"><label for="selfEmail">邮箱</label><input id="selfEmail" type="email" name="email" value="{{ user.email }}" maxlength="254"><small>用于已启用的密码重置邮件。</small></div><div class="ops-actions"><button type="submit" class="btn-sm btn-primary">保存资料</button><span data-ops-form-status role="status"></span></div></form></section>
<section class="op-card"><h2>修改密码</h2><form method="post" action="{% url 'operations:profile' %}" data-ops-post>{% csrf_token %}<input name="action" type="hidden" value="password"><div class="op-field"><label for="selfOldPassword">原密码</label><input id="selfOldPassword" name="old_password" type="password" autocomplete="current-password" required></div><div class="op-field"><label for="selfNewPassword">新密码</label><input id="selfNewPassword" name="new_password" type="password" autocomplete="new-password" required></div><div class="op-field"><label for="selfConfirmPassword">确认新密码</label><input id="selfConfirmPassword" name="confirm_password" type="password" autocomplete="new-password" required></div><div class="ops-actions"><button type="submit" class="btn-sm btn-primary">更新密码</button><span data-ops-form-status role="status"></span></div></form></section></div>
{% endblock %}
