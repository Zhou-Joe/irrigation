{% load static %}<link rel="stylesheet" href="{% static 'operations/pest-map.css' %}?v=20261108workspace2"><link rel="stylesheet" href="{% static 'operations/pest-map-layout.css' %}?v=20261108workspace2"><link rel="stylesheet" href="{% static 'operations/map-markers.css' %}?v=20261108pins1">
<div class="mobile-overlay" id="mobileOverlay"></div><div class="dashboard-container" id="mapContainer" data-business="pest-control"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><button class="sidebar-toggle" id="pestSidebarClose" title="收起侧边栏"><svg class="ui-icon"><use href="#pwa-close"/></svg></button><div class="sidebar-header-content"><h1>植保区域</h1><p class="zone-count" id="zoneCount">正在加载地点…</p></div></div><div class="sidebar-body"><label class="pest-search-label" for="zoneSearch">搜索地点</label><input class="pest-search" id="zoneSearch" placeholder="地点名称或编号…"><div id="pestLocationList"></div></div></aside>
<main class="map-container"><div id="map"></div><button class="sidebar-expand-btn" id="sidebarExpandBtn" title="展开侧边栏"><svg class="ui-icon"><use href="#pwa-chevron-right"/></svg></button><div class="mobile-btn-cluster" id="mobileBtnCluster"><div id="mobileLocateSlot"></div></div>
<div class="map-layer-panel" id="mapLayerPanel"><button class="map-layer-toggle-btn map-tool-btn" id="mapLayerToggleBtn" title="图层控制"><svg class="ui-icon"><use href="#pwa-layers"/></svg></button><div class="map-layer-body" id="mapLayerBody" hidden><div class="map-layer-title">植保图层</div><label><input type="checkbox" data-pest-layer="shared" checked>共享地点与边界</label><label><input type="checkbox" data-pest-layer="zones" checked>本团队作业区域</label><label><input type="checkbox" data-pest-layer="buildings" checked>建筑与房间</label><label><input type="checkbox" data-pest-layer="monitoring" checked>监测点</label><label><input type="checkbox" data-pest-layer="records" checked>最近作业记录</label></div></div>
<div class="map-filter-widget" id="mapFilterWidget"><button type="button" class="filter-toggle-btn map-tool-btn" id="filterToggleBtn" title="筛选"><svg class="ui-icon"><use href="#pwa-filter"/></svg></button><div class="filter-panel" id="pestFilterPanel" hidden style="display:block"><label for="pestMapKind">地点类型</label><select class="v2-select" id="pestMapKind"><option value="">全部类型</option><option value="zone">室外区域</option><option value="building">建筑</option><option value="floor">楼层</option><option value="room">房间</option><option value="monitoring">监测点</option><option value="other">其他地点</option></select></div></div>
<div id="pestMapNotice" class="pest-map-notice" role="status">正在加载团队地图…</div></main></div>
<div class="v2-modal-backdrop" id="woModalBackdrop" hidden></div><section class="v2-modal-container pest-modal" id="woModalContainer" role="dialog" aria-modal="true" aria-labelledby="pestFormTitle" hidden><header class="v2-modal-header"><h2 id="pestFormTitle">植保作业工单</h2><button class="v2-modal-close" id="pestCloseWorkorder" aria-label="关闭表单"><svg class="ui-icon"><use href="#pwa-close"/></svg></button></header><div class="v2-modal-body" id="woModalBody"></div><footer class="v2-modal-footer"><button type="button" class="v2-btn-map" id="pestChangePlaces">修改区域</button><span id="pestSubmitStatus" role="status"></span><button class="v2-btn-submit" id="woSubmitBtn">提交</button></footer></section>
<div id="pestPickInfo" class="v2-map-info-bar" hidden></div><div id="pestPickActions" class="v2-map-action-bar" hidden><button type="button" class="v2-act-btn v2-act-cancel" id="pestPickList">返回列表</button><button type="button" class="v2-act-btn v2-act-clear" id="pestPickClear">清除</button><button type="button" class="v2-act-btn v2-act-confirm" id="pestPickDone">确认区域</button></div>
<span id="pestCanSubmit" data-value="{% if can_pest_submit %}yes{% else %}no{% endif %}" data-manager="{% if can_pest_manage %}yes{% else %}no{% endif %}" hidden></span>{% include 'operations/_batch_tools.html' %}
