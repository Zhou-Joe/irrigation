{% load static %}<link rel="stylesheet" href="{% static 'operations/pest-map.css' %}?v=20261108pins1"><link rel="stylesheet" href="{% static 'operations/pest-map-layout.css' %}?v=20261108chips3"><link rel="stylesheet" href="{% static 'operations/map-markers.css' %}?v=20261108pins1">
<div class="mobile-overlay" id="mobileOverlay" hidden></div>
<div class="dashboard-container" id="mapContainer" data-business="pest-control">
  <aside class="sidebar" id="sidebar"><div class="sidebar-header"><h2>植保区域</h2><button class="pest-icon" id="pestSidebarClose" aria-label="收起侧边栏"><svg class="ui-icon"><use href="#pwa-chevron-left"/></svg></button></div><div class="sidebar-body"><label class="pest-search-label" for="zoneSearch">搜索地点</label><input class="pest-search" id="zoneSearch" placeholder="地点名称或编号…"><div id="pestLocationList"></div></div></aside>
  <main class="map-container"><div id="map"></div><button class="sidebar-expand-btn" id="sidebarExpandBtn" title="展开侧边栏"><svg class="ui-icon"><use href="#pwa-chevron-right"/></svg></button>
    <div class="map-layer-panel" id="mapLayerPanel"><button class="map-layer-toggle-btn map-tool-btn" id="mapLayerToggleBtn" aria-label="图层控制" title="图层控制"><svg class="ui-icon"><use href="#pwa-layers"/></svg></button><div class="map-layer-body" id="mapLayerBody" hidden><div class="map-layer-title">植保图层</div><label><input type="checkbox" data-pest-layer="shared" checked>共享地点与边界</label><label><input type="checkbox" data-pest-layer="zones" checked>本团队作业区域</label><label><input type="checkbox" data-pest-layer="buildings" checked>建筑与房间</label><label><input type="checkbox" data-pest-layer="monitoring" checked>监测点</label><label><input type="checkbox" data-pest-layer="records" checked>最近作业记录</label></div></div>
    <div id="pestMapNotice" class="pest-map-notice" role="status">正在加载团队地图…</div>
    {% if can_pest_submit %}<button class="pest-create v2-btn-submit" id="pestCreateWorkorder"><svg class="ui-icon"><use href="#pwa-clipboard"/></svg> 创建工单</button>{% endif %}
  </main>
</div>
<div class="v2-modal-backdrop" id="woModalBackdrop" hidden></div><section class="v2-modal-container pest-modal" id="woModalContainer" role="dialog" aria-modal="true" aria-labelledby="pestFormTitle" hidden><header class="v2-modal-header"><h2 id="pestFormTitle">植保作业工单</h2><button class="v2-modal-close" id="pestCloseWorkorder" aria-label="关闭表单"><svg class="ui-icon"><use href="#pwa-close"/></svg></button></header><div class="v2-modal-body" id="woModalBody"></div><footer class="v2-modal-footer"><span id="pestSubmitStatus" role="status"></span><button class="v2-btn-submit" id="woSubmitBtn">提交工单</button></footer></section>
<span id="pestCanSubmit" data-value="{% if can_pest_submit %}yes{% else %}no{% endif %}" hidden></span>
