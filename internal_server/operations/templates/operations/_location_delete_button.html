{% if location.created_at and not location.legacy_zone_id %}<button type="button" class="{{ delete_button_class|default:'btn-sm btn-secondary' }} loc-delete-button" data-location-delete="{% url 'operations:location_delete' location.pk %}" data-location-id="{{ location.pk }}" data-location-name="{{ location.name }}" data-team="{{ membership.team_id }}" title="删除 {{ location.name }}" aria-label="删除 {{ location.name }}"><svg class="ui-icon" aria-hidden="true"><use href="#pwa-trash"/></svg>{% if not delete_icon_only %}删除地点{% endif %}</button>{% endif %}
