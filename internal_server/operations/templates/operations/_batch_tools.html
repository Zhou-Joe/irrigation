{% if can_manage or can_pest_manage %}
<dialog class="fos-batch-dialog" id="fosBatchDialog" aria-labelledby="fosBatchTitle"><form method="post" action="{% url 'operations:location_batch' %}" data-batch-create>{% csrf_token %}<input type="hidden" name="team" value="{% if membership %}{{ membership.team_id }}{% else %}{{ workspace_membership.team_id }}{% endif %}"><input type="hidden" name="submission_key" value=""><div class="op-title-row"><h2 id="fosBatchTitle">批量新增地点</h2><button type="button" data-batch-close class="op-btn op-secondary" aria-label="关闭">×</button></div><p>从 Excel 直接粘贴多行，或上传 CSV。只填一列名称也可以，不要求编号或边界。</p><label>默认类型 <select name="kind">{% for value,label in location_kind_choices %}<option value="{{ value }}" {% if value == 'building' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label class="op-field">批量内容<textarea name="rows" rows="8" class="v2-textarea" placeholder="地点名称&#9;编号&#9;类型&#9;上级编号&#9;纬度&#9;经度&#9;说明"></textarea></label><label class="op-field">CSV 文件（可选）<input type="file" name="file" accept=".csv,text/csv"></label><p data-batch-status role="status"></p><div data-batch-preview></div><div class="op-actions"><button type="submit" name="action" value="preview" class="op-btn op-secondary">检查预览</button><button type="submit" name="action" value="create" class="op-btn">批量创建</button></div></form></dialog>
{% endif %}
