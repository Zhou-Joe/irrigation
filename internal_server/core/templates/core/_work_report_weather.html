<div class="zd-weather" title="提交时天气">
  <span class="zd-wx-icon"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="{% if '雨' in weather_desc %}#pwa-rain{% elif '晴' in weather_desc %}#pwa-sun{% else %}#pwa-cloud{% endif %}"/></svg></span>
  <div class="zd-wx-txt"><span class="zd-wx-desc">{{ weather_desc|default:'天气未记录' }}</span>{% if weather_temp %}<span class="zd-wx-temp">{{ weather_temp }}</span>{% endif %}</div>
</div>
